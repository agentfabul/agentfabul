<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="agentfabul — full-stack engineer building tools that run real operations">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#12243d" stroke-width="1"/>
    </pattern>
    <pattern id="hazard" width="28" height="12" patternUnits="userSpaceOnUse" patternTransform="skewX(-45)">
      <rect width="14" height="12" fill="#f5a524"/>
      <rect x="14" width="14" height="12" fill="#0a1628"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="visor"><rect x="852" y="122" width="176" height="52" rx="26"/></clipPath>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0a1628" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#0a1628" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0a1628" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
      .eye  { animation: scan 2.6s ease-in-out infinite alternate; }
      .beacon { animation: pulse 1.8s ease-in-out infinite; }
      @keyframes scan  { from { transform: translateX(0); } to { transform: translateX(120px); } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
      @media (prefers-reduced-motion: reduce) { .eye, .beacon { animation: none; } }
    </style>
  </defs>

  <!-- chassis -->
  <rect width="1200" height="340" fill="#0a1628"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect x="40" y="40" width="700" height="250" fill="url(#fade)"/>

  <!-- identity -->
  <g transform="translate(72 0)">
    <circle cx="6" cy="92" r="6" fill="#3fb950" class="beacon"/>
    <text x="22" y="98" class="mono" font-size="16" fill="#3fb950">online</text>
    <text x="96" y="98" class="mono" font-size="16" fill="#4c6a88">agentfabul.os v2.6</text>

    <text x="-4" y="178" class="mono" font-size="86" font-weight="700" fill="#e6f1fb" letter-spacing="-2">agentfabul</text>

    <text x="0" y="222" class="sans" font-size="23" fill="#8fb3d1">Full-stack engineer building tools that run real operations.</text>
    <text x="0" y="262" class="mono" font-size="17" fill="#22d3ee">Node.js / TypeScript / React / PostgreSQL</text>
  </g>

  <!-- robot -->
  <g>
    <!-- antenna -->
    <line x1="940" y1="70" x2="940" y2="38" stroke="#2b4a6f" stroke-width="4" stroke-linecap="round"/>
    <circle cx="940" cy="32" r="8" fill="#f5a524" filter="url(#glow)" class="beacon"/>
    <!-- ears -->
    <rect x="804" y="128" width="18" height="44" rx="6" fill="#1b3354"/>
    <rect x="1058" y="128" width="18" height="44" rx="6" fill="#1b3354"/>
    <!-- head -->
    <rect x="820" y="70" width="240" height="190" rx="30" fill="#12243d" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="842" cy="92" r="4" fill="#2b4a6f"/><circle cx="1038" cy="92" r="4" fill="#2b4a6f"/>
    <circle cx="842" cy="238" r="4" fill="#2b4a6f"/><circle cx="1038" cy="238" r="4" fill="#2b4a6f"/>
    <!-- visor -->
    <rect x="850" y="120" width="180" height="56" rx="28" fill="#050d18" stroke="#1e3a5f" stroke-width="2"/>
    <g clip-path="url(#visor)">
      <g class="eye">
        <ellipse cx="882" cy="148" rx="26" ry="12" fill="#22d3ee" filter="url(#glow)"/>
        <ellipse cx="882" cy="148" rx="10" ry="5" fill="#e6fbff"/>
      </g>
    </g>
    <!-- grille -->
    <g fill="#1e3a5f">
      <rect x="884" y="204" width="112" height="6" rx="3"/>
      <rect x="884" y="218" width="112" height="6" rx="3"/>
    </g>
    <!-- neck -->
    <rect x="910" y="260" width="60" height="22" fill="#1b3354"/>
    <rect x="880" y="282" width="120" height="16" rx="4" fill="#12243d" stroke="#1e3a5f"/>
  </g>

  <!-- hazard rail -->
  <rect y="328" width="1200" height="12" fill="url(#hazard)"/>
</svg>
